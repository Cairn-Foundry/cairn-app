<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cairn Foundry</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 3000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: oklch(0.155 0.008 70);
      }
      #boot-splash svg:first-child {
        fill: #6c8eff;
        animation: boot-breathe 1.8s ease-in-out infinite;
      }
      #boot-splash .boot-spinner {
        animation: boot-spin 0.6s linear infinite;
        transform-origin: 50% 50%;
      }
      @keyframes boot-breathe {
        0%, 100% { opacity: 0.55; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1); }
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="boot-splash">
      <svg width="44" height="44" viewBox="0 0 24 24">
        <ellipse cx="12" cy="6.75" rx="2.77" ry="1.69" />
        <ellipse cx="12" cy="11.4" rx="4.27" ry="2.02" />
        <ellipse cx="12" cy="16.5" rx="6.09" ry="2.39" />
      </svg>
      <svg class="boot-spinner" width="16" height="16" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="oklch(0.29 0.008 70)" stroke-width="2.66" />
        <circle cx="12" cy="12" r="10" stroke="#6c8eff" stroke-width="2.66" stroke-linecap="round" stroke-dasharray="15.71 62.83" />
      </svg>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
