stages:
  - test
  - quality
  - release

default:
  image: oven/bun:1
  cache:
    key:
      files:
        - bun.lock
        - package.json
      prefix: bun-v2
    paths:
      - node_modules/
    policy: pull

# ─── Test ─────────────────────────────────────────────────────────────────────

typecheck:
  stage: test
  cache:
    key:
      files:
        - bun.lock
        - package.json
      prefix: bun-v2
    paths:
      - node_modules/
    policy: pull-push
  script:
    - bun install --frozen-lockfile
    - bun run check

unit:
  stage: test
  script:
    - bun install --frozen-lockfile
    - bunx svelte-kit sync
    - bun run test:coverage
  coverage: '/^All files\s*\|\s*[\d.]+/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 1 day

# ─── Quality ──────────────────────────────────────────────────────────────────

lint:
  stage: quality
  needs: []
  script:
    - bun install --frozen-lockfile
    - bun run lint:ci

audit:
  stage: quality
  needs: []
  script:
    - bun install --frozen-lockfile
    - bun audit
  allow_failure: true

# ─── Release ──────────────────────────────────────────────────────────────────

version-check:
  stage: release
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - PKG=$(bun --print "require('./package.json').version")
    - CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
    - echo "tag=$VERSION package.json=$PKG Cargo.toml=$CARGO"
    - test "$VERSION" = "$PKG" || (echo "package.json version does not match the tag" && exit 1)
    - test "$VERSION" = "$CARGO" || (echo "Cargo.toml version does not match the tag" && exit 1)
