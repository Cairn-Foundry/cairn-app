stages:
  - test
  - quality
  - release

default:
  image: oven/bun:1
  cache:
    key:
      files:
        - bun.lock
    paths:
      - node_modules/
    policy: pull-push

# ─── Test ─────────────────────────────────────────────────────────────────────

typecheck:
  stage: test
  script:
    - bun install --frozen-lockfile
    - bun run check

unit:
  stage: test
  cache: []
  script:
    - rm -rf node_modules .svelte-kit
    - bun install --frozen-lockfile
    - bunx svelte-kit sync
    - bun run test:coverage
  coverage: '/^All files\s*\|\s*[\d.]+/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 1 day

rust:
  stage: test
  needs: []
  image: rust:1-bookworm
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/
      - src-tauri/target/
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
      libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      libgtk-3-dev librsvg2-dev patchelf pkg-config
  script:
    - mkdir -p src-tauri/binaries
    - touch src-tauri/binaries/cairn-cli-x86_64-unknown-linux-gnu
    - cd src-tauri && cargo test --locked

# ─── Quality ──────────────────────────────────────────────────────────────────

lint:
  stage: quality
  needs: []
  script:
    - bun install --frozen-lockfile
    - bun run lint:ci

audit:
  stage: quality
  needs: []
  script:
    - bun install --frozen-lockfile
    - bun audit
  allow_failure: true

# ─── Release ──────────────────────────────────────────────────────────────────

version-check:
  stage: release
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - PKG=$(bun --print "require('./package.json').version")
    - CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
    - echo "tag=$VERSION package.json=$PKG Cargo.toml=$CARGO"
    - test "$VERSION" = "$PKG" || (echo "package.json version does not match the tag" && exit 1)
    - test "$VERSION" = "$CARGO" || (echo "Cargo.toml version does not match the tag" && exit 1)
