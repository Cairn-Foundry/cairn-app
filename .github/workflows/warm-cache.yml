name: Warm build cache

# The release workflow only runs on tag pushes, and a tag ref can only restore
# caches saved on that same ref or on the default branch. Nothing used to save
# one on main, so every release compiled Rust from scratch on all five targets.
# This job runs the same compile on main and leaves the cache where the next
# tag build finds it. The matrix must stay identical to the one in release.yml.

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/warm-cache.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: warm-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { artifact: bundle-linux-x86_64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { artifact: bundle-macos-universal, runner: macos-latest, target: universal-apple-darwin }
          - { artifact: bundle-windows-x86_64, runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { artifact: bundle-windows-aarch64, runner: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { artifact: bundle-linux-aarch64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: startsWith(matrix.runner, 'ubuntu')
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev xdg-utils
          version: 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.artifact }}
          cache-on-failure: true

      - run: bun install --frozen-lockfile

      - name: Build the CLI launcher sidecar
        shell: bash
        run: scripts/build-cli-launcher.sh ${{ matrix.target }}

      - name: Build
        run: bun run tauri build --target ${{ matrix.target }} --no-bundle
