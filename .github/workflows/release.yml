name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.12.0)"
        required: true
      linux_only:
        description: "Build the Linux x86_64 target only (cheap pipeline rehearsal)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      notes: ${{ steps.resolve.outputs.notes }}
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve and check version
        id: resolve
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          PKG=$(bun --print "require('./package.json').version")
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "$VERSION" != "$PKG" ] || [ "$VERSION" != "$CARGO" ]; then
            echo "version mismatch: tag=$VERSION package.json=$PKG Cargo.toml=$CARGO" >&2
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "notes<<RELEASE_NOTES_EOF"
            git tag -l --format='%(contents)' "$TAG"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compose build matrix
        id: matrix
        env:
          LINUX_ONLY: ${{ github.event.inputs.linux_only }}
        run: |
          set -euo pipefail
          FULL='[
            {"artifact":"bundle-linux-x86_64","runner":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","bundles":"appimage"},
            {"artifact":"bundle-macos-universal","runner":"macos-latest","target":"universal-apple-darwin","bundles":"app,dmg"},
            {"artifact":"bundle-windows-x86_64","runner":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis"},
            {"artifact":"bundle-windows-aarch64","runner":"windows-11-arm","target":"aarch64-pc-windows-msvc","bundles":"nsis"},
            {"artifact":"bundle-linux-aarch64","runner":"ubuntu-22.04-arm","target":"aarch64-unknown-linux-gnu","bundles":"appimage"}
          ]'
          if [ "${LINUX_ONLY:-}" = "true" ]; then
            VALUE=$(echo "$FULL" | jq -c '[.[] | select(.artifact == "bundle-linux-x86_64")]')
          else
            VALUE=$(echo "$FULL" | jq -c '.')
          fi
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
          echo "$VALUE"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.verify.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Install Linux dependencies
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev build-essential curl wget file xdg-utils

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.artifact }}

      - run: bun install --frozen-lockfile

      - name: Enable Apple signing when the secrets are present
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "No Apple certificate configured: the macOS bundle will not be signed."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "$name is empty while APPLE_CERTIFICATE is set: refusing a half-configured signing setup" >&2
              exit 1
            fi
            {
              echo "$name<<APPLE_ENV_EOF"
              echo "$value"
              echo "APPLE_ENV_EOF"
            } >> "$GITHUB_ENV"
          done

      - name: Build the CLI launcher sidecar
        shell: bash
        run: scripts/build-cli-launcher.sh ${{ matrix.target }}

      - name: Build
        run: bun run tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [verify, build]
    if: ${{ github.event.inputs.linux_only != 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compose latest.json
        env:
          RELEASE_NOTES: ${{ needs.verify.outputs.notes }}
        run: |
          bun scripts/build-updater-manifest.mjs \
            "${{ needs.verify.outputs.version }}" \
            "${{ needs.verify.outputs.tag }}" \
            artifacts \
            artifacts/latest.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: ${{ needs.verify.outputs.tag }}
          body: ${{ needs.verify.outputs.notes }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/latest.json
            artifacts/bundle-*/**/*.dmg
            artifacts/bundle-*/**/*.app.tar.gz
            artifacts/bundle-*/**/*.app.tar.gz.sig
            artifacts/bundle-*/**/*-setup.exe
            artifacts/bundle-*/**/*-setup.exe.sig
            artifacts/bundle-*/**/*.AppImage
            artifacts/bundle-*/**/*.AppImage.sig
