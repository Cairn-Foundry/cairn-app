[package]
name = "cairn"
version = "1.2.0"
description = "Cairn Foundry - a desktop workspace for developing with an AI coding agent"
authors = ["Benjamin Bonneton"]
edition = "2024"
license = "AGPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cairn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["cli"]

[profile.release]
lto = "thin"
codegen-units = 4

[[bin]]
name = "cairn"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"
tauri-plugin-clipboard-manager = "2"
dirs = "7"
shellexpand = "3.1.2"
open = "5.3"
git2 = { version = "0.21", default-features = false }
regex = "1"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
nucleo-matcher = "0.3"
portable-pty = "0.9.0"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-notification = "2.8"
tauri-plugin-single-instance = "2"
lsp-types = "0.97"
toml = "1"
base64 = "0.23"
which = "8"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
chacha20poly1305 = "0.11"
getrandom = "0.4"
tokio = { version = "1", features = ["time", "sync"] }
toml_edit = { version = "0.25.13", features = ["parse", "display"] }
notify = "8"
sha1 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

